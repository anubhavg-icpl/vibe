<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100">
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background waves -->
  <path d="M0,50 Q30,30 60,50 T120,50 T180,50 T240,50 T300,50 T360,50 T420,50 T480,50 T500,50"
        fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.25"/>
  <path d="M0,60 Q30,40 60,60 T120,60 T180,60 T240,60 T300,60 T360,60 T420,60 T480,60 T500,60"
        fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.15"/>

  <!-- Main VIBE text -->
  <text x="30" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#vibeGrad)" filter="url(#glow)">
    VIBE
  </text>

  <!-- Separator line -->
  <line x1="175" y1="30" x2="175" y2="75" stroke="url(#vibeGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Subtitle section -->
  <text x="195" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a78bfa" font-weight="600">
    AI Chat Modes + Skills
  </text>
  <text x="195" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8">
    750 modes · 675 skills · 52 categories
  </text>

  <!-- Mode count badge - positioned separately -->
  <rect x="365" y="32" width="120" height="36" rx="18" fill="#1e1b4b" stroke="url(#vibeGrad)" stroke-width="2"/>
  <text x="425" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#f0abfc" text-anchor="middle" font-weight="bold">
    750+ Modes
  </text>

  <!-- Decorative elements -->
  <circle cx="15" cy="15" r="4" fill="#667eea" opacity="0.7"/>
  <circle cx="28" cy="25" r="2.5" fill="#764ba2" opacity="0.5"/>
  <circle cx="15" cy="85" r="3" fill="#f093fb" opacity="0.6"/>
  <circle cx="485" cy="18" r="4" fill="#00d4ff" opacity="0.7"/>
  <circle cx="472" cy="82" r="3" fill="#7c3aed" opacity="0.5"/>

  <!-- Code symbols -->
  <text x="340" y="70" font-family="'Fira Code', 'Consolas', monospace" font-size="11" fill="#64748b" opacity="0.4">&lt;/&gt;</text>
</svg>
